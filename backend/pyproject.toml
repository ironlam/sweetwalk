[project]
name = "sweetwalk"
version = "0.1.0"
description = "Multi-criteria walking route optimizer"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "osmnx>=2.0",
    "networkx>=3.4",
    "geopandas>=1.0",
    "shapely>=2.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.scripts]
sweetwalk-pipeline = "sweetwalk.pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
]
